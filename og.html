<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Cihat Karaboğa — social preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      body {
        background: #f7f8fc;
        color: #192238;
        font-family:
          "Manrope",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        padding: 48px 64px;
        position: relative;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -1px;
      }
      .brand img {
        width: 40px;
        height: 40px;
        border-radius: 11px;
      }
      main {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 55px;
        margin-top: 34px;
      }
      .role {
        font-size: 18px;
        color: #576176;
        margin-bottom: 18px;
      }
      h1 {
        font-size: 91px;
        font-weight: 800;
        letter-spacing: -6px;
        line-height: 1.05;
      }
      .tagline {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -1px;
        margin-top: 23px;
      }
      .studio {
        width: 355px;
        height: 350px;
        background: #e9eafd;
        border-radius: 28px;
        display: grid;
        place-items: center;
        position: relative;
      }
      .phone {
        width: 150px;
        height: 285px;
        padding: 6px;
        background: #20283b;
        border-radius: 27px;
        transform: rotate(9deg);
        box-shadow: 12px 16px 28px #17244826;
      }
      .screen {
        position: relative;
        background: #fbfcff;
        width: 100%;
        height: 100%;
        border-radius: 21px;
        padding: 25px 12px 12px;
      }
      .island {
        position: absolute;
        top: 6px;
        left: 46px;
        width: 46px;
        height: 12px;
        background: #20283b;
        border-radius: 10px;
      }
      .app-title {
        font-size: 10px;
        font-weight: 800;
        margin-top: 10px;
      }
      .app-subtitle {
        font-size: 6px;
        color: #626d83;
        margin-top: 5px;
      }
      .pulse {
        width: 100px;
        height: 100px;
        border: 5px solid #5474e6;
        border-right-color: #e5eafa;
        border-radius: 50%;
        margin: 18px auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .pulse strong {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -1px;
      }
      .pulse span {
        font-size: 7px;
        color: #626d83;
      }
      .chart {
        background: #edf0f9;
        border-radius: 8px;
        padding: 10px;
      }
      .chart svg {
        width: 100%;
        height: 25px;
        display: block;
      }
      .home {
        width: 45px;
        height: 3px;
        background: #20283b;
        border-radius: 4px;
        margin: 15px auto 0;
      }
      .badge {
        position: absolute;
        bottom: 43px;
        right: 13px;
        background: #fff;
        border: 1px solid #dce1ed;
        padding: 10px 14px;
        font-size: 12px;
        font-weight: 700;
        border-radius: 10px;
      }
      footer {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 38px;
        padding-top: 22px;
        border-top: 1px solid #dce1ed;
        display: flex;
        justify-content: space-between;
        color: #576176;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="brand"><img src="./favicon.svg" alt="" />karaboga.dev</div>
    <main>
      <div>
        <p class="role">Mobile Software Engineer in Istanbul</p>
        <h1>Cihat<br />Karaboğa.</h1>
        <p class="tagline">Thoughtful apps. Solid engineering.</p>
      </div>
      <div class="studio" aria-hidden="true">
        <div class="phone">
          <div class="screen">
            <div class="island"></div>
            <div class="app-title">Sağlıklı Sürüş</div>
            <div class="app-subtitle">A little care. Every journey.</div>
            <div class="pulse"><strong>72</strong><span>beats / min</span></div>
            <div class="chart">
              <svg viewBox="0 0 100 30" fill="none">
                <path
                  d="M0 19h10l4-4 5 9 7-21 7 24 6-10h12l4-5 6 8 5-15 5 20 6-8h23"
                  stroke="#5474e6"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
            <div class="home"></div>
          </div>
        </div>
        <div class="badge">Flutter · iOS &amp; Android</div>
      </div>
    </main>
    <footer>
      <span>5+ years building mobile products</span
      ><span>cihat@karaboga.dev</span>
    </footer>
  </body>
</html>
